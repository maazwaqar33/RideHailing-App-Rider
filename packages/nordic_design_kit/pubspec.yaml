name: nordic_design_kit
description: "Nordic Mobility design kit (tokens, theme and reusable widgets) shared by the Rider and, later, Driver apps."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.3
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  material_symbols_icons: ^4.2960.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/nordic_logo.png
    - assets/nordic_logo_full.png
  fonts:
    # Inter (SIL OFL 1.1, see fonts/LICENSE.txt), bundled so the app never needs network for typography.
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
          weight: 400
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
